# OTel agent-tier collector — DEBUG variant.
#
# Same receivers and processors as otel-agent-config.yaml, but spans print to
# stdout instead of going to the LGTM gateway. No TLS material, no gateway, no
# disk queue — the point is to prove the app→collector hop works today.
#
# Run:  docker compose -f docker-compose.yml -f docker-compose.debug.yml up otel-agent
# Watch: docker compose logs -f otel-agent
#
# When the gateway is reachable, drop the override file and the production
# config takes over unchanged.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318   # LangSmith's OTLP exporter targets this one

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  resource/identity:
    attributes:
      - key: service.name
        value: "${env:OTEL_SERVICE_NAME}"
        action: upsert
      - key: deployment.environment
        value: "${env:ENVIRONMENT}"
        action: upsert
      - key: collector.tier
        value: agent
        action: insert

  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.x-api-key
        action: delete

  # Flush fast so spans appear in the log within ~1s of a query instead of
  # batching for 2s. Debug-only — the production config keeps the larger batch.
  batch:
    send_batch_size: 1
    timeout: 1s

exporters:
  # verbosity: detailed prints every span with its full attribute set, so you
  # can confirm the GenAI semconv fields (model, token counts) actually arrive.
  debug:
    verbosity: detailed
    sampling_initial: 100
    sampling_thereafter: 100

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/identity, attributes/scrub, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/identity, attributes/scrub, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/identity, batch]
      exporters: [debug]
