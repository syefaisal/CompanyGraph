# OTel Collector — agent tier for CogniGraph (local / docker-compose).
#
# Sits between the FastAPI backend and the LGTM gateway. The backend ships
# plaintext OTLP to this collector; this collector owns the mTLS client cert
# for the gateway hop and buffers to disk so a gateway outage never blocks or
# drops a trace.
#
# Per the LGTM ADR: fan-out/routing lives at the gateway only — this tier is a
# plain forwarder to one endpoint.

extensions:
  file_storage:
    directory: /var/lib/otelcol/storage
    timeout: 5s
    compaction:
      on_start: true
      directory: /var/lib/otelcol/storage

  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      # 0.0.0.0 inside the container. The backend runs on the HOST (start.sh),
      # so docker-compose publishes these ports — but bound to 127.0.0.1 on the
      # host side, so only local processes can reach them.
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318   # LangSmith's OTLP exporter targets this one

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # Identity attributes. These become Tempo resource attrs and the routing key
  # at the gateway — set them here so they're consistent no matter which
  # backend process emitted the span.
  resource/identity:
    attributes:
      - key: service.name
        value: "${env:OTEL_SERVICE_NAME}"
        action: upsert
      - key: deployment.environment
        value: "${env:ENVIRONMENT}"
        action: upsert
      - key: collector.tier
        value: agent
        action: insert

  # Drop anything that would blow up cardinality or leak. CogniGraph already
  # runs a PII output scan in utils.py, but prompt/response text can ride along
  # in LangSmith span attributes — decide explicitly what leaves the host.
  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.x-api-key
        action: delete

  batch:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 2s

exporters:
  otlp/gateway:
    endpoint: "${env:LGTM_GATEWAY_ENDPOINT}"
    tls:
      ca_file: /etc/otelcol/tls/ca.crt
      cert_file: /etc/otelcol/tls/tls.crt
      key_file: /etc/otelcol/tls/tls.key
    balancer_name: round_robin
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      storage: file_storage
      num_consumers: 4
      queue_size: 5000

  # Local development without a gateway: comment out otlp/gateway in the
  # pipelines below and use this instead to see spans on stdout.
  debug:
    verbosity: normal

service:
  extensions: [file_storage, health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/identity, attributes/scrub, batch]
      exporters: [otlp/gateway]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/identity, attributes/scrub, batch]
      exporters: [otlp/gateway]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/identity, batch]
      exporters: [otlp/gateway]
