name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Fast checks — no external services ────────────────────────────────
  syntax-and-unit:
    name: Syntax & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check — all Python files in backend/
        run: |
          python -m py_compile \
            backend/api.py backend/graph.py backend/mcp_server.py \
            backend/seed.py backend/eval.py backend/doc_to_graph.py \
            backend/models.py backend/query_tests.py
          echo "All files pass syntax check"

      - name: Run unit tests (no external services)
        run: |
          python3 -m pytest \
            tests/test_unit_bm25.py \
            tests/test_unit_routing.py \
            tests/test_unit_safety.py \
            -v --tb=short

  # ── Job 2: Validate prompt YAML files ───────────────────────────────────────
  prompt-validation:
    name: Prompt Version Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pyyaml
        run: pip install "pyyaml>=6.0"

      - name: Validate all prompt YAML files
        run: |
          python3 scripts/validate_prompts.py

  # ── Job 3: Integration tests — Neo4j required ────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [syntax-and-unit, prompt-validation]

    services:
      neo4j:
        image: neo4j:5.15-community
        env:
          NEO4J_AUTH: neo4j/companygraph123
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p companygraph123 'RETURN 1' 2>/dev/null || wget -qO- http://localhost:7474/ > /dev/null 2>&1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 40s

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: companygraph123
      # Dummy key — sufficient for graph + non-LLM API tests
      ANTHROPIC_API_KEY: sk-ant-dummy-key-for-ci-integration-tests
      PROMPT_VERSION: v2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for Neo4j to be ready
        run: |
          echo "Waiting for Neo4j..."
          for i in $(seq 1 30); do
            if python3 -c "from neo4j import GraphDatabase; \
              d = GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j','companygraph123')); \
              d.verify_connectivity(); d.close(); print('Neo4j ready')" 2>/dev/null; then
              break
            fi
            echo "Attempt $i/30 — retrying in 5s"
            sleep 5
          done

      - name: Seed PropTech graph
        run: python backend/seed.py

      - name: Graph integration tests
        run: |
          python3 -m pytest tests/test_integration_graph.py \
            -m "integration and not llm" \
            -v --tb=short

      - name: Start API server
        run: |
          cd backend && uvicorn api:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          echo "API_PID=$!" >> $GITHUB_ENV
          # Wait until healthy
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/ > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 3
          done

      - name: API integration tests (no LLM calls)
        run: |
          python3 -m pytest tests/test_integration_api.py \
            -m "integration and not llm" \
            -v --tb=short

      - name: Show API logs on failure
        if: failure()
        run: cat /tmp/api.log 2>/dev/null || echo "No API log found"
